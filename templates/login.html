<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormGen — Sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div class="card" style="max-width: 400px; width: 100%; text-align: center; padding: 2.5rem;">
            <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">FormGen</h1>
            <p class="subtitle" style="margin-bottom: 2rem;">AI-powered Google Form generator</p>

            {% if error %}
            <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px; margin-bottom: 1.5rem;">
                <p style="color: #dc2626; font-size: 13px;">{{ error }}</p>
            </div>
            {% endif %}

            <a href="/auth/google" class="google-signin-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right: 10px;">
                    <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                    <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
                    <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
                    <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
                </svg>
                Sign in with Google
            </a>

            <p style="font-size: 12px; color: var(--text-muted); margin-top: 1.5rem;">
                By signing in, you agree to allow FormGen to access your Google Forms and Gmail.
            </p>
        </div>
    </div>

    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
        }
    </script>
</body>
</html>
